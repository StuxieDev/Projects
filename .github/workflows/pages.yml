name: Deploy to GitHub Pages

# The only thing that publishes projects.stuxie.dev: the repo's Pages source is "GitHub Actions" (not "Deploy from a
# branch"), so GitHub doesn't also publish the whole branch and race this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # Only the site goes up: upload-pages-artifact has no exclude option, so copy the repo into _site without the
      # repo's own files (workflows, tests, commit and dev scripts, docs for contributors). CHANGELOG.md and VERSION.md
      # stay: the changelog page and the footer's version link read them.
      - name: Collect the site
        run: |
          rsync -a ./ _site/ \
            --exclude '.git/' --exclude '.github/' --exclude '_site/' --exclude 'tests/' \
            --exclude '*.sh' --exclude '*.bat' --exclude 'dev-server.js' \
            --exclude 'README.md' --exclude 'CONTRIBUTING.md' \
            --exclude '.gitignore' --exclude '.gitattributes'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
